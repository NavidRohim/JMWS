plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '7.0.0-beta.46'
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url "https://repo.spongepowered.org/maven" }
    maven {url = 'https://maven.blamejared.com'}
    maven {url = "https://jm.gserv.me/repository/maven-public/"}
    mavenCentral()
    mavenLocal()
}

def baseName = "${mod_id}-forge"
base.archivesName = baseName



minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        register('client') {
            workingDir.convention layout.projectDirectory.dir('run/client')
        }

        register('server') {
            workingDir.convention layout.projectDirectory.dir('run/server')
            args '--nogui'
        }
    }

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}");
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.10'
    //annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // Forge's hack fix
    //implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
    //implementation 'org.slf4j:slf4j-api:2.0.17'

    compileOnly group: 'info.journeymap', name: 'journeymap-api-forge', version: project.journeymap_api_version, changing: true
    implementation "mysticdrew:common-networking-forge:1.0.22-1.21.10"

}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
