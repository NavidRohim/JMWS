plugins {
    id 'multiloader-loader'
    // see https://docs.fabricmc.net/develop/porting/next for 26.1 changes to plugin id
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

base {
    archivesName = "${mod_id}-fabric"
}

repositories {
    maven {
        name = "New JourneyMap Maven"
        url = 'https://maven.blamejared.com'
    }
    maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
    maven {
        url = "https://jm.gserv.me/repository/maven-public/"
    }
}

dependencies {
    runtimeOnly 'net.fabricmc.unpick:unpick-format-utils:3.0.0-beta.5'
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // JourneyMap TODO: NOT PORTED
    implementation "mysticdrew:common-networking-fabric:${common_networking_version}"
    compileOnlyApi group: 'info.journeymap', name: 'journeymap-api-common', version: project.journeymap_api_version, changing: true
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
